<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Maas'awo</title>
  <!-- Maas'awo: an M' painted on a Kampala signboard over a yellow and black kerb. Not tied to one
       vehicle: the game climbs from boda to bus. Everything sits inside the maskable safe circle. -->
  <rect width="512" height="512" fill="#c8312b"/>
  <circle cx="256" cy="256" r="236" fill="#d23a2f"/>
  <g transform="translate(256 262) scale(0.8) translate(-266 -260)">
  <g stroke-linejoin="round" stroke-linecap="round">
    <g transform="translate(10 12)" fill="#5c1712" stroke="#5c1712" stroke-width="22">
      <path d="M118 318V124h66l58 80 58-80h66v194h-60V216l-46 60h-36l-46-60v102z"/>
      <path d="M392 124h40l-16 62h-30z"/>
    </g>
    <g fill="#f4c430" stroke="#2a2420" stroke-width="22" paint-order="stroke">
      <path d="M118 318V124h66l58 80 58-80h66v194h-60V216l-46 60h-36l-46-60v102z"/>
      <path d="M392 124h40l-16 62h-30z"/>
    </g>
  </g>
  <clipPath id="kerb"><rect x="108" y="352" width="324" height="44" rx="12"/></clipPath>
  <g clip-path="url(#kerb)">
    <rect x="108" y="352" width="324" height="44" fill="#f4c430"/>
    <path fill="#2a2420" d="M148 352h40l-20 44h-40zM228 352h40l-20 44h-40zM308 352h40l-20 44h-40zM388 352h40l-20 44h-40z"/>
  </g>
  <rect x="108" y="352" width="324" height="44" rx="12" fill="none" stroke="#2a2420" stroke-width="8"/>
  </g>
</svg>
